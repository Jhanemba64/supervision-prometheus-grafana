global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # Hôte Docker : CPU et disque de la machine qui porte les serveurs
  - job_name: node-host
    scrape_interval: 5s
    static_configs:
      - targets: [node-exporter:9100]
        labels: { server: docker-host }

  # Partition /data de chaque serveur (un agent par serveur)
  - job_name: node-servers
    scrape_interval: 5s
    static_configs:
      - targets: [agent-web:9100]
        labels: { server: srv-web-01 }
      - targets: [agent-db:9100]
        labels: { server: srv-db-01 }
      - targets: [agent-cache:9100]
        labels: { server: srv-cache-01 }

  # CPU de chaque serveur (cgroups) ; on ne garde que les conteneurs srv-*
  - job_name: cadvisor
    scrape_interval: 5s
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      - source_labels: [name]
        regex: srv-.+
        action: keep
      - source_labels: [name]
        target_label: server

  # Disponibilité des services critiques, sondés de l'extérieur par blackbox_exporter
  - job_name: services
    scrape_interval: 5s
    metrics_path: /probe
    static_configs:
      - targets: [http://srv-web-01:80/]
        labels: { module: http_2xx, server: srv-web-01, service: Serveur web (nginx) }
      - targets: [srv-db-01:5432]
        labels: { module: tcp_connect, server: srv-db-01, service: Base de données (PostgreSQL) }
      - targets: [srv-cache-01:6379]
        labels: { module: redis, server: srv-cache-01, service: Cache (Redis) }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
